    <script>
      // Polyfill/shim window.fetch with a setter to allow extension interceptors without throwing getter errors
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (_) {}

        // Prevent third-party chrome extension errors from interrupting the applet
        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
